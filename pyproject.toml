[project]
name = "oop3.2"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.10.2",
    "ruff>=0.15.6",
    "ty>=0.0.23",
]

[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4

extend-exclude = [
    "ui_*.py",
    "*_rc.py",
]

[tool.ruff.lint]
select = [  # https://docs.astral.sh/ruff/rules/
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "B",  # bugbear
    "SIM",  # simplify,
    "UP",    # pyupgrade
    "RUF",   # ruff-specific rules
    "N",     # pep8-naming
]

ignore = [
    "E501",
    "RUF001",    # ambiguous unicode character in string: Cyrillic vs Latin
    "RUF002",    # ambiguous unicode character in docstring: Cyrillic
    "RUF003",    # ambiguous unicode character in comment
    "RUF067",    # detects the presence of code in __init__.py files
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.pep8-naming]
extend-ignore-names = [
    "*Event",
    "eventFilter",
]
